services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    # Internal only — Dokploy Domains / Traefik routes here (no host publish)
    expose:
      - "${APP_PORT:-3000}"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

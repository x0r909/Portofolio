services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    # Publish to Dokploy LXC host (avoid :3000 — used by Dokploy UI)
    ports:
      - "${HOST_PORT:-3080}:${APP_PORT:-3000}"

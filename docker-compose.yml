services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    # Host port for Cloudflare Tunnel → http://127.0.0.1:${HOST_PORT}
    ports:
      - "${HOST_PORT:-3000}:3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
